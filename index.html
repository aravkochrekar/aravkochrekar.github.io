<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My STEM Portfolio</title>
    <!-- Connects our external CSS stylesheet for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main card wrapper that holds our portfolio contents -->
    <main class="portfolio-card">
        
        <!-- Header Section: Holds profile avatar, name, and tagline -->
        <header class="profile-header">
            <div class="avatar-placeholder">💻</div>
            <h1>Alex Developer</h1>
            <p class="tagline">Aspiring Web Developer & Tech Enthusiast</p>
        </header>

        <!-- About Section: Short intro paragraph -->
        <section class="about-section">
            <h2>About Me</h2>
            <p>Welcome to my corner of the web! I love learning how to code, building creative websites, and exploring new technologies.</p>
        </section>

        <!-- Skills Section: Grid of tech badges -->
        <section class="skills-section">
            <h2>Skills</h2>
            <div class="skills-grid">
                <span class="skill-tag">HTML5</span>
                <span class="skill-tag">CSS3</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Git & GitHub</span>
            </div>
        </section>
        
        <!-- Action Button: Triggers JavaScript on click -->
        <button id="contactBtn">Get in Touch</button>
    </main>

    <!-- Connects our external JavaScript file for interactivity -->
    <script src="script.js"></script>
</body>
</html>
