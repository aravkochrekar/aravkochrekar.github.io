<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arav Kochrekar - STEM Portfolio</title>
    <!-- Link to external CSS styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container -->
    <main class="portfolio-card">
        
        <!-- Header Section -->
        <header class="profile-header">
            <div class="avatar-placeholder">AK</div>
            <h1>Arav Kochrekar</h1>
            <p class="tagline">Aspiring Engineer & Tech Enthusiast</p>
        </header>

        <!-- Scrollable Page Views Container -->
        <div class="content-container" id="scrollContainer">
            
            <!-- HOME PAGE SECTION -->
            <section id="home" class="page-section">
                <h2>Skills</h2>
                <div class="skills-grid">
                    <span class="skill-tag">###</span>
                </div>

                <!-- Interactive Contact Button -->
                <button id="contactBtn">Get in Touch</button>
            </section>

            <!-- PROJECTS SECTION (Section heading acts as nav link) -->
            <section id="projects" class="page-section">
                <a href="#projects" class="page-nav-btn">Projects</a>
                <div class="wip-box">
                    <h3>Work in Progress</h3>
                    <p>I will be showcasing my engineering, coding, and robotics projects here soon!</p>
                </div>
            </section>

            <!-- GAME SECTION (Section heading acts as nav link) -->
            <section id="game" class="page-section">
                <a href="#game" class="page-nav-btn">Game</a>
                <div class="wip-box">
                    <h3>Work in Progress</h3>
                    <p>An interactive game is currently under construction. Stay tuned!</p>
                </div>
            </section>

        </div>

        <!-- Back to Top Button (Appears when scrolling down) -->
        <button id="backToTopBtn" class="back-to-top hidden" aria-label="Back to Top">▲</button>

    </main>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
