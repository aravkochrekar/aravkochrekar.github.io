<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Developer Portfolio</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container for our portfolio content -->
    <main class="portfolio-card">
        <!-- Profile / Header section -->
        <header class="profile-header">
            <div class="avatar-placeholder">💻</div>
            <h1>Alex Developer</h1>
            <p class="tagline">Aspiring Web Developer & Tech Enthusiast</p>
        </header>

        <!-- About Me Section -->
        <section class="about-section">
            <h2>About Me</h2>
            <p>Welcome to my corner of the web! I love learning how to code, building creative websites, and exploring new technologies.</p>
        </section>

        <!-- Skills Section -->
        <section class="skills-section">
            <h2>Skills</h2>
            <div class="skills-grid">
                <span class="skill-tag">HTML5</span>
                <span class="skill-tag">CSS3</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Git & GitHub</span>
            </div>
        </section>
        
        <!-- Interactive Contact Button -->
        <button id="contactBtn">Get in Touch</button>
    </main>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
