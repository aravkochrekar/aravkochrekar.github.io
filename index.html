<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arav Kochrekar - STEM Portfolio</title>
    <!-- Link to external CSS styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container -->
    <main class="portfolio-card">
        
        <!-- Header Section -->
        <header class="profile-header">
            <!-- Profile avatar with initials AK -->
            <div class="avatar-placeholder">AK</div>
            <h1>Arav Kochrekar</h1>
            <p class="tagline">Aspiring Engineer & Tech Enthusiast</p>
        </header>

        <!-- About Section -->
        <section class="about-section">
            <h2>About Me</h2>
            <p>Welcome to my corner of the web! I love learning how to code, building creative websites, and exploring engineering technologies.</p>
        </section>

        <!-- Skills Section -->
        <section class="skills-section">
            <h2>Skills</h2>
            <div class="skills-grid">
                <span class="skill-tag">HTML5</span>
                <span class="skill-tag">CSS3</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Git & GitHub</span>
            </div>
        </section>
        
        <!-- Interactive Contact Button -->
        <button id="contactBtn">Get in Touch</button>
    </main>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
